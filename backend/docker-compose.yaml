version: "3.8"
services:
  app:
    image: athulkrishnama/compass
    ports: 
      - 4000:4000
    environment:
      - port=4000
    env_file:
      - ./.env.production
    depends_on:
      - mongodb
    networks:
      - compass-network

  mongodb:
    image: mongodb/mongodb-community-server:7.0-ubi8
    networks:
      - compass-network

  redis:
    networks:
      - compass-network
    image: redis:8.2.2-bookworm

  promotheues:
    networks:
      - compass-network
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-data:/prometheus
  
  grafana:
    networks:
      - compass-network
    image: grafana/grafana
    ports:
      - 3000:3000
    volumes:
      - ./grafana_data:/var/lib/grafana
    
    
networks:
  compass-network:
